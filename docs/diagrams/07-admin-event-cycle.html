<!DOCTYPE html>

<head>

  <title>One event, from setup to report · SIMADRepair</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FBFCFB; --ink: #131815; --muted: #515852; --soft: #646B65; --accent: #0F7A45; --rule: #E4E8E5;
      --font-sans: 'Hanken Grotesk', system-ui, sans-serif; --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 32px; }
    .frame { max-width: 1280px; width: 100%; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 10px; }
    .eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .lede { font-size: 17px; color: var(--muted); margin-top: 6px; max-width: 900px; }
    .brand { font-family: var(--font-mono); font-size: 12px; color: var(--soft); white-space: nowrap; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    .foot { font-size: 14px; color: var(--soft); margin-top: 6px; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>

      <div>
        <p class="eyebrow">07 · Admin</p>
        <h1>One event, from setup to report</h1>
        <p class="lede">The admin sets the week up once; registration, volunteer accounts, the report and data clean-up all follow the event’s dates automatically.</p>
      </div>
      <p class="brand">SIMADRepair · Faculty of Computing</p>
    </div>
